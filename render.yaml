services:
  - type: web
    runtime: python
    name: helio-support-console
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: HELIO_MODEL_FILE
        value: deployment_assets/model_english_multilingual.joblib
      - key: HELIO_HIDE_SOURCES
        value: "1"
